{% extends "master.html" %}

{% load static %}

{% block title %}
  Typing Tutor - Results
{% endblock %}

{% block content %}
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80%;
            width: 500px;
            height: 400px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 10px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin: 10px 0;
            font-size: 20px;
        }

        .try-again-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #fff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .try-again-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Results</h1>
        <p>Correct Words: {{ results.correct_words }}</p>
        <p>Words Per Minute: {{ results.words_per_minute }}</p>
        <p>Score: {{ results.score }}</p>
        <a href="{% url 'typing_test' %}" class="try-again-button">Try Again</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    window.location.href = "{% url 'typing_test' %}";
                }
            });
        });
    </script>
</body>
{% endblock %}
