{% extends "master.html" %}

{% load static %}

{% block title %}
Typing Tutor - Sign Up
{% endblock %}

{% block content %}
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 500px;
            height: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 1.2em;
            margin: 50px auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 10px;
        }

        label, input, button {
            padding: 10px;
            margin: 0 5px;
        }

        input {
            flex-grow: 1;
            width: 70%;
        }

        label {
            width: 30%;
        }

        button {
            padding: 10px;
            width: 100%;
            background-color: #28a745; /* Using green for sign up */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1e7e34;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
{% endblock %}
