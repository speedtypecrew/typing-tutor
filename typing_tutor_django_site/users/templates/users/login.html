{% extends "master.html" %}

{% load static %}

{% block title %}
Typing Tutor - Login
{% endblock %}

{% block content %}
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            width: 500px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-row {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }

        label, input, button {
            padding: 8px;
            margin: 10px 0;
        }

        input {
            width: 90%; 
            padding: 8px;
            margin-left: 10px;
        }

        label {
            width: 100%;
            text-align: left;
        }

        button {
            width: 50%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #1e7e34;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label for="id_username">Username:</label>
                <input type="text" name="username" id="id_username" required>
            </div>
            <div class="form-row">
                <label for="id_password">Password:</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            
            <button type="submit">Login</button>
            <button type="button" id="signupButton" data-url="{% url 'signup' %}">Sign Up</button>
            
        </form>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var signupButton = document.getElementById('signupButton');
        if (signupButton) {
            signupButton.addEventListener('click', function() {
                window.location.href = this.getAttribute('data-url');
            });
        }
    });
    </script>
</body>
{% endblock %}
